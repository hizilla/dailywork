<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lee · 开源工作看板</title>
  <meta name="description" content="Lee 的日常开源工作看板：项目进度、贡献热力图、活动时间线与周度待办。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1 class="hero-title">Lee<span class="dot">.</span>看板</h1>
      <p class="hero-sub">日常开源工作看板 · 一页看清进展</p>
      <ul class="stats" id="stats">
        <li><span class="stat-num" id="stat-projects">-</span><span class="stat-label">活跃项目</span></li>
        <li><span class="stat-num" id="stat-contribs">-</span><span class="stat-label">近期贡献</span></li>
        <li><span class="stat-num" id="stat-week">-</span><span class="stat-label">本周待办</span></li>
      </ul>
    </div>
  </header>

  <main class="container">

    <section class="block">
      <div class="block-head">
        <h2>项目看板</h2>
        <span class="block-note">按状态分列 · 数据见 data/projects.md</span>
      </div>
      <div class="kanban" id="kanban">
        <div class="kanban-col" data-status="doing">
          <h3>Doing<span class="col-count" id="count-doing">0</span></h3>
          <div class="kanban-cards" id="cards-doing"></div>
        </div>
        <div class="kanban-col" data-status="todo">
          <h3>Todo<span class="col-count" id="count-todo">0</span></h3>
          <div class="kanban-cards" id="cards-todo"></div>
        </div>
        <div class="kanban-col" data-status="done">
          <h3>Done<span class="col-count" id="count-done">0</span></h3>
          <div class="kanban-cards" id="cards-done"></div>
        </div>
      </div>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>贡献热力图</h2>
        <span class="block-note">近 12 周 · data/contributions.md</span>
      </div>
      <div class="heatmap" id="heatmap"></div>
      <div class="heatmap-legend">
        <span>少</span>
        <i class="lv lv-0"></i><i class="lv lv-1"></i><i class="lv lv-2"></i><i class="lv lv-3"></i><i class="lv lv-4"></i>
        <span>多</span>
      </div>
    </section>

    <div class="grid-two">
      <section class="block">
        <div class="block-head">
          <h2>活动时间线</h2>
          <span class="block-note">data/activities.md</span>
        </div>
        <ol class="timeline" id="timeline"></ol>
      </section>

      <section class="block">
        <div class="block-head">
          <h2>本周待办</h2>
          <span class="block-note">data/todos.md</span>
        </div>
        <ul class="todo" id="todo"></ul>
      </section>
    </div>

  </main>

  <footer class="footer">
    <p>© <span id="year"></span> Lee · 由 <a href="https://github.com/hizilla/dailywork" target="_blank" rel="noopener">dailywork</a> 驱动 · 数据纯 markdown 维护</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
